<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Acxiom Workspace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container" style="max-width: 420px;">
    
    <div class="text-center mb-4">
      <div class="brand-logo justify-content-center mb-2">
        <div class="brand-icon"><i class="bi bi-layers-fill"></i></div>
        <span class="text-dark fs-4">Acxiom Workspace</span>
      </div>
      <p class="text-muted small">Enter your organization email to access your workspace</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4">
      <div id="authAlert" class="alert alert-danger d-none py-2 small mb-3" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold">Work Email</label>
          <input type="email" class="form-control form-control-lg fs-6" id="email" required placeholder="alex@acxiom.com">
          <div class="invalid-feedback d-none" id="emailError">Please enter a valid work email address.</div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <label for="password" class="form-label small fw-semibold">Password</label>
          </div>
          <input type="password" class="form-control form-control-lg fs-6" id="password" required placeholder="••••••••">
          <div class="invalid-feedback d-none" id="passwordError">Password must be at least 6 characters.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fs-6 fw-semibold py-2">
          Sign In to Workspace
        </button>
      </form>

      <div class="mt-4 pt-3 border-top">
        <label class="form-label text-muted small fw-semibold mb-2">Select Account Role Profile:</label>
        <div class="d-grid gap-2">
          <button class="btn btn-outline-secondary btn-sm text-start d-flex align-items-center justify-content-between" onclick="setProfile('admin@acxiom.com', 'Password123!')">
            <span><strong class="text-dark">Elena Vance</strong> &middot; System Admin</span>
            <span class="badge badge-role-admin">Admin</span>
          </button>
          <button class="btn btn-outline-secondary btn-sm text-start d-flex align-items-center justify-content-between" onclick="setProfile('manager@acxiom.com', 'Password123!')">
            <span><strong class="text-dark">Marcus Brody</strong> &middot; Sales Manager</span>
            <span class="badge badge-role-manager">Manager</span>
          </button>
          <button class="btn btn-outline-secondary btn-sm text-start d-flex align-items-center justify-content-between" onclick="setProfile('sales1@acxiom.com', 'Password123!')">
            <span><strong class="text-dark">Alex Turner</strong> &middot; Sales Exec</span>
            <span class="badge badge-role-sales">Sales Exec</span>
          </button>
        </div>
      </div>
    </div>

    <p class="text-center text-muted small mt-4">&copy; 2026 Acxiom CRM Inc. Protected environment.</p>

  </div>

  <script>
    function setProfile(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('emailError').classList.add('d-none');
      document.getElementById('passwordError').classList.add('d-none');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('authAlert');

    if (urlParams.get('error') === 'account_deactivated') {
      alertBox.textContent = 'Account disabled. Contact your administrator.';
      alertBox.classList.remove('d-none');
    } else if (urlParams.get('error') === 'account_locked') {
      alertBox.textContent = 'Account locked due to repeated failed login attempts.';
      alertBox.classList.remove('d-none');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      let valid = true;
      if (!email || !email.includes('@')) {
        document.getElementById('emailError').classList.remove('d-none');
        valid = false;
      } else {
        document.getElementById('emailError').classList.add('d-none');
      }

      if (!password || password.length < 6) {
        document.getElementById('passwordError').classList.remove('d-none');
        valid = false;
      } else {
        document.getElementById('passwordError').classList.add('d-none');
      }

      if (!valid) return;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          alertBox.textContent = data.error || 'Invalid authentication details.';
          alertBox.classList.remove('d-none');
        } else {
          window.location.href = '/dashboard';
        }
      } catch (err) {
        alertBox.textContent = 'Unable to connect to service.';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
